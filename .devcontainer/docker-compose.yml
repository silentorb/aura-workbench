# Match Dev Containers' project name so host `docker compose` and the IDE share one stack.
name: aura-workbench_devcontainer

x-mnt-volumes: &mnt-volumes
  - ..:/workspaces/aura-workbench
  # Sibling repos under the workbench .mnt/ tree (same pattern as the old Aura workspace).
  - ${AURA_ENGINE_PATH:-../../aura-engine}:/workspaces/aura-workbench/.mnt/aura-engine
  - ${AURA_EDITOR_PATH:-../../aura-editor}:/workspaces/aura-workbench/.mnt/aura-editor
  - ${IMP_RS_PATH:-../../imp-rs}:/workspaces/aura-workbench/.mnt/imp-rs
  - ${IMP_SPEC_PATH:-../../imp-spec}:/workspaces/aura-workbench/.mnt/imp-spec
  - ${IMP_LAB_PATH:-../../imp-lab}:/workspaces/aura-workbench/.mnt/imp-lab
  - ${IMP_TS_PATH:-../../imp-ts}:/workspaces/aura-workbench/.mnt/imp-ts
  - ${IMP_GRAPH_VIEW_PATH:-../../imp-graph-view}:/workspaces/aura-workbench/.mnt/imp-graph-view
  # Temporary: Imp workbench sibling (remove when no longer needed).
  - ${IMP_WORKBENCH_PATH:-../../imp-workbench}:/workspaces/aura-workbench/.mnt/imp-workbench
  - ${MIR_PATH:-../../mir}:/workspaces/aura-workbench/.mnt/mir:ro
  - ${TOME_RUST_SERVER_PATH:-../../tome-rust-server}:/workspaces/aura-workbench/.mnt/tome-rust-server
  # Cargo path deps in aura-engine resolve `.mnt/imp-*` relative to the engine root.
  - ${IMP_RS_PATH:-../../imp-rs}:/workspaces/aura-workbench/.mnt/aura-engine/.mnt/imp-rs
  - ${TOME_RUST_SERVER_PATH:-../../tome-rust-server}:/workspaces/aura-workbench/.mnt/aura-engine/.mnt/tome-rust-server
  - ${IMP_SPEC_PATH:-../../imp-spec}:/workspaces/aura-workbench/.mnt/aura-engine/.mnt/imp-spec

services:
  engine:
    image: aura-workbench-engine:local
    build:
      context: ..
      dockerfile: docker/engine/Dockerfile
    volumes: *mnt-volumes
    working_dir: /workspaces/aura-workbench/.mnt/aura-engine
    command: sleep infinity

  # Imp Lab desktop host (Dockerfile owned by imp-lab; Bun + WebKitGTK).
  imp-lab:
    image: imp-lab:local
    build:
      context: ${IMP_LAB_PATH:-../../imp-lab}
      dockerfile: docker/Dockerfile
      additional_contexts:
        "aura-workbench-engine:local": "service:engine"
      args:
        BASE_IMAGE: aura-workbench-engine:local
    volumes: *mnt-volumes
    working_dir: /workspaces/aura-workbench/.mnt/imp-lab
    command: sleep infinity
    depends_on:
      - engine

  # On-demand Windows MSVC cross-compile (not in devcontainer runServices).
  editor-windows:
    image: aura-workbench-editor-windows:local
    build:
      context: ..
      dockerfile: docker/editor-windows/Dockerfile
      additional_contexts:
        "aura-workbench-engine:local": "service:engine"
      args:
        BASE_IMAGE: aura-workbench-engine:local
    # Keep in sync with x-mnt-volumes, plus the Windows output mount.
    volumes:
      - ..:/workspaces/aura-workbench
      - ${AURA_ENGINE_PATH:-../../aura-engine}:/workspaces/aura-workbench/.mnt/aura-engine
      - ${AURA_EDITOR_PATH:-../../aura-editor}:/workspaces/aura-workbench/.mnt/aura-editor
      - ${IMP_RS_PATH:-../../imp-rs}:/workspaces/aura-workbench/.mnt/imp-rs
      - ${IMP_SPEC_PATH:-../../imp-spec}:/workspaces/aura-workbench/.mnt/imp-spec
      - ${IMP_LAB_PATH:-../../imp-lab}:/workspaces/aura-workbench/.mnt/imp-lab
      - ${IMP_TS_PATH:-../../imp-ts}:/workspaces/aura-workbench/.mnt/imp-ts
      - ${IMP_GRAPH_VIEW_PATH:-../../imp-graph-view}:/workspaces/aura-workbench/.mnt/imp-graph-view
      - ${IMP_WORKBENCH_PATH:-../../imp-workbench}:/workspaces/aura-workbench/.mnt/imp-workbench
      - ${MIR_PATH:-../../mir}:/workspaces/aura-workbench/.mnt/mir:ro
      - ${TOME_RUST_SERVER_PATH:-../../tome-rust-server}:/workspaces/aura-workbench/.mnt/tome-rust-server
      - ${IMP_RS_PATH:-../../imp-rs}:/workspaces/aura-workbench/.mnt/aura-engine/.mnt/imp-rs
      - ${TOME_RUST_SERVER_PATH:-../../tome-rust-server}:/workspaces/aura-workbench/.mnt/aura-engine/.mnt/tome-rust-server
      - ${IMP_SPEC_PATH:-../../imp-spec}:/workspaces/aura-workbench/.mnt/aura-engine/.mnt/imp-spec
      - ${AURA_EDITOR_WIN_OUT:-../.win-out}:/out
    working_dir: /workspaces/aura-workbench/.mnt/imp-lab
    command: sleep infinity
    depends_on:
      - engine
