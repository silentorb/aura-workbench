# Match Dev Containers' project name so host `scripts/compose` and the IDE share one stack.
name: aura-workbench_devcontainer

# Sibling repos: host ../<repo> (relative to this file: ../../<repo>) → /workspaces/<repo>.
# Sibling-relative paths (aura-engine's ../imp-rs Cargo deps, aura-editor's ../imp-lab)
# resolve the same inside and outside containers.
# *_PATH overrides live in .devcontainer/.env (see .env.example).
x-repo-volumes: &repo-volumes
  - ${WORKBENCH_PATH:-..}:/workspaces/aura-workbench
  - ${AURA_ENGINE_PATH:-../../aura-engine}:/workspaces/aura-engine
  - ${AURA_EDITOR_PATH:-../../aura-editor}:/workspaces/aura-editor
  - ${IMP_RS_PATH:-../../imp-rs}:/workspaces/imp-rs
  - ${IMP_SPEC_PATH:-../../imp-spec}:/workspaces/imp-spec
  - ${IMP_LAB_PATH:-../../imp-lab}:/workspaces/imp-lab
  - ${IMP_TS_PATH:-../../imp-ts}:/workspaces/imp-ts
  - ${IMP_GRAPH_VIEW_PATH:-../../imp-graph-view}:/workspaces/imp-graph-view
  - ${TOME_RUST_SERVER_PATH:-../../tome-rust-server}:/workspaces/tome-rust-server
  - ${MIR_PATH:-../../mir}:/workspaces/mir:ro
  # Skill links in .claude/skills and .agents/skills resolve here (IDE attach).
  - ${SILENTORB_AGENTS_PATH:-../../silentorb-agents}:/workspaces/silentorb-agents:ro

services:
  # Engine build/test (Rust + ALSA). Also the optional Dev Container attach target.
  engine:
    image: aura-workbench-engine:local
    build:
      context: ..
      dockerfile: docker/engine/Dockerfile
    volumes: *repo-volumes
    user: vscode
    working_dir: /workspaces/aura-engine
    command: sleep infinity

  # Imp Lab desktop host (Dockerfile owned by imp-lab; Bun + WebKitGTK). Also builds/tests
  # aura-editor and assembles the Aura pack.
  imp-lab:
    image: imp-lab:local
    build:
      context: ${IMP_LAB_PATH:-../../imp-lab}
      dockerfile: docker/Dockerfile
      additional_contexts:
        "aura-workbench-engine:local": "service:engine"
      args:
        BASE_IMAGE: aura-workbench-engine:local
    volumes: *repo-volumes
    user: vscode
    working_dir: /workspaces/imp-lab
    command: sleep infinity
    depends_on:
      - engine

  # On-demand Windows MSVC cross-compile (profile `windows`; use
  # scripts/run-imp-lab-windows-build.sh). Same mounts as above plus /out.
  editor-windows:
    profiles: ["windows"]
    image: aura-workbench-editor-windows:local
    build:
      context: ..
      dockerfile: docker/editor-windows/Dockerfile
      additional_contexts:
        "aura-workbench-engine:local": "service:engine"
      args:
        BASE_IMAGE: aura-workbench-engine:local
    volumes:
      - ${WORKBENCH_PATH:-..}:/workspaces/aura-workbench
      - ${AURA_ENGINE_PATH:-../../aura-engine}:/workspaces/aura-engine
      - ${AURA_EDITOR_PATH:-../../aura-editor}:/workspaces/aura-editor
      - ${IMP_RS_PATH:-../../imp-rs}:/workspaces/imp-rs
      - ${IMP_SPEC_PATH:-../../imp-spec}:/workspaces/imp-spec
      - ${IMP_LAB_PATH:-../../imp-lab}:/workspaces/imp-lab
      - ${IMP_TS_PATH:-../../imp-ts}:/workspaces/imp-ts
      - ${IMP_GRAPH_VIEW_PATH:-../../imp-graph-view}:/workspaces/imp-graph-view
      - ${TOME_RUST_SERVER_PATH:-../../tome-rust-server}:/workspaces/tome-rust-server
      - ${MIR_PATH:-../../mir}:/workspaces/mir:ro
      - ${AURA_EDITOR_WIN_OUT:-../.win-out}:/out
    user: vscode
    working_dir: /workspaces/imp-lab
    command: sleep infinity
    depends_on:
      - engine
